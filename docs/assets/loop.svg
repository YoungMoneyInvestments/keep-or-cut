<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Your Claude home is split into classes. Each class is scored alone against bare, across models.">
  <rect width="1200" height="560" fill="#0b0d10"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#e8a54b" font-size="16" letter-spacing="3">WHAT THE BENCH ACTUALLY ANSWERS</text>
    <text x="40" y="82" fill="#f4f0e6" font-size="28" font-weight="700">Which class still earns tokens — and which models have outgrown it</text>
    <text x="40" y="116" fill="#9aa3ad" font-size="16">Claude, Codex, Grok — any skills and hooks pile. Each class runs alone against bare.</text>

    <!-- header -->
    <text x="280" y="168" text-anchor="middle" fill="#9aa3ad" font-size="15">Haiku</text>
    <text x="500" y="168" text-anchor="middle" fill="#9aa3ad" font-size="15">Sonnet</text>
    <text x="720" y="168" text-anchor="middle" fill="#9aa3ad" font-size="15">Opus</text>
    <text x="980" y="168" text-anchor="middle" fill="#9aa3ad" font-size="15">What that means</text>

    <!-- row claude.md -->
    <rect x="40" y="186" width="1120" height="72" rx="10" fill="#15181e"/>
    <text x="60" y="230" fill="#f4f0e6" font-size="20" font-weight="700">CLAUDE.md</text>
    <text x="280" y="230" text-anchor="middle" fill="#e8a54b" font-size="22">+0.4</text>
    <text x="500" y="230" text-anchor="middle" fill="#9aa3ad" font-size="22">+0.1</text>
    <text x="720" y="230" text-anchor="middle" fill="#d94b3d" font-size="22">−0.6</text>
    <text x="980" y="230" text-anchor="middle" fill="#e8a54b" font-size="16">fading</text>

    <!-- row skills -->
    <rect x="40" y="270" width="1120" height="72" rx="10" fill="#15181e"/>
    <text x="60" y="314" fill="#f4f0e6" font-size="20" font-weight="700">skills</text>
    <text x="280" y="314" text-anchor="middle" fill="#7dcea0" font-size="22">+1.6</text>
    <text x="500" y="314" text-anchor="middle" fill="#e8a54b" font-size="22">+0.5</text>
    <text x="720" y="314" text-anchor="middle" fill="#9aa3ad" font-size="22">+0.2</text>
    <text x="980" y="314" text-anchor="middle" fill="#e8a54b" font-size="16">fading</text>

    <!-- row hooks -->
    <rect x="40" y="354" width="1120" height="72" rx="10" fill="#15181e"/>
    <text x="60" y="398" fill="#f4f0e6" font-size="20" font-weight="700">hooks</text>
    <text x="280" y="398" text-anchor="middle" fill="#e8a54b" font-size="22">+0.8</text>
    <text x="500" y="398" text-anchor="middle" fill="#d94b3d" font-size="22">−0.4</text>
    <text x="720" y="398" text-anchor="middle" fill="#d94b3d" font-size="22">−1.3</text>
    <text x="980" y="398" text-anchor="middle" fill="#d94b3d" font-size="16">REMOVE on Opus</text>

    <text x="40" y="468" fill="#6b7380" font-size="14">Numbers in this picture are a layout example, not a run. Your leaderboard is the real table.</text>
    <text x="40" y="500" fill="#6b7380" font-size="14">KEEP ≥ +1.5 · PROMPT_BLOAT in between · REMOVE ≤ −1.0 · fading = stronger models get less lift</text>
    <text x="40" y="536" fill="#9aa3ad" font-size="15">A class that helps Haiku and hurts Opus is the one to delete when you upgrade.</text>
  </g>
</svg>
