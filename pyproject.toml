[project]
name = "keep-or-cut"
version = "0.1.0"
description = "Score which skills, hooks, CLAUDE.md, and AGENTS.md still help after newer models baked that advice into the session prompt."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
keep_or_cut = "keep_or_cut.cli:main"
keep-or-cut = "keep_or_cut.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["keep_or_cut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["results", ".venv", ".git"]
